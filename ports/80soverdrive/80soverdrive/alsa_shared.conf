# 80's Overdrive - shared ALSA output for AmberELEC
# FMOD opens sysdefault:CARD=..., while OpenAL opens default.
# Route both to a shared dmix PCM to avoid exclusive-device conflicts.
</usr/share/alsa/alsa.conf>

pcm.!default {
    type plug
    slave.pcm "overdrive_dmix"
}

pcm.overdrive_dmix {
    type dmix
    ipc_key 80801984
    ipc_perm 0666
    slave {
        pcm {
            type hw
            card 0
            device 0
        }
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 4096
    }
}

pcm.!sysdefault {
    @args [ CARD ]
    @args.CARD {
        type string
        default {
            @func getenv
            vars [ ALSA_PCM_CARD ALSA_CARD ]
            default { @func refer name defaults.pcm.card }
        }
    }
    type plug
    slave.pcm "default"
    hint {
        description "Default Audio Device (shared)"
        device_output { @func refer name defaults.pcm.dmix.device }
        device_input { @func refer name defaults.pcm.dsnoop.device }
    }
}
