# 80's Overdrive - ALSA alias for PipeWire systems
# FMOD opens sysdefault:CARD=..., so the alias must accept a CARD argument.
</usr/share/alsa/alsa.conf>

pcm.!sysdefault {
    @args [ CARD ]
    @args.CARD {
        type string
        default {
            @func getenv
            vars [ ALSA_PCM_CARD ALSA_CARD ]
            default { @func refer name defaults.pcm.card }
        }
    }
    type plug
    slave.pcm "default"
    hint {
        description "Default Audio Device"
        device_output { @func refer name defaults.pcm.dmix.device }
        device_input { @func refer name defaults.pcm.dsnoop.device }
    }
}
